<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>BillSplit – Personal Shared Expense and Bill Tracker</title>
  <!-- Mobile Web App meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="BillSplit" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#4f7df9" />
  <meta name="description" content="BillSplit is a personal shared expense and bill tracking web application." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <!-- ───── Sidebar overlay (for mobile drawer) ───── -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ───── Sidebar (Desktop rail / Mobile Drawer) ───── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
          <line x1="1" y1="10" x2="23" y2="10"/>
        </svg>
        <span class="brand-name">BillSplit</span>
      </div>
      <p class="sidebar-subtitle">Personal Expense Tracker</p>

      <nav class="sidebar-nav">
        <a href="#" class="nav-link active" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
          </svg>
          <span>Dashboard</span>
        </a>
        <a href="#" class="nav-link" data-view="expenses">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"/>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
          <span>Expenses</span>
        </a>
        <a href="#" class="nav-link" data-view="payments">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5 a2 2 0 0 1 2-2h11"/>
          </svg>
          <span>Payments</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <p class="sidebar-credits">Tinambacan · Cabrera · Matucol</p>
        <p class="sidebar-copy">&copy; 2026 BillSplit</p>
      </div>
    </aside>

    <!-- ───── Main content area ───── -->
    <main class="main">
      <!-- Top bar (Header for laptop & mobile) -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger" id="hamburger" aria-label="Toggle menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="6"  x2="21" y2="6"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <div class="topbar-info">
            <h1 id="page-title">Dashboard</h1>
            <p id="page-subtitle">Your shared expense overview</p>
          </div>
        </div>

        <div class="topbar-right">
          <span class="current-date" id="current-date"></span>

          <div class="user-chip">
            <span class="avatar-circle">BS</span>
            <span class="workspace-badge">My Workspace</span>
          </div>
        </div>
      </header>

      <!-- Scrollable content area -->
      <div class="content" id="main-content-scroll">
        <section id="dashboard-view" class="view-section active"></section>
        <section id="expense-view"   class="view-section"></section>
        <section id="payment-view"   class="view-section"></section>
      </div>

      <!-- ───── Floating Action Button (FAB) for Mobile View ───── -->
      <button class="fab" id="fab-add" aria-label="Add New Expense" title="Add New Expense">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>

      <!-- ───── Mobile Bottom Navigation Bar (Shown on Mobile screens) ───── -->
      <nav class="bottom-nav" id="bottom-nav" aria-label="App Navigation">
        <a href="#" class="nav-link active" data-view="dashboard">
          <div class="nav-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5"/>
              <rect x="14" y="3" width="7" height="7" rx="1.5"/>
              <rect x="3" y="14" width="7" height="7" rx="1.5"/>
              <rect x="14" y="14" width="7" height="7" rx="1.5"/>
            </svg>
          </div>
          <span>Dashboard</span>
        </a>
        <a href="#" class="nav-link" data-view="expenses">
          <div class="nav-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="1" x2="12" y2="23"/>
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
          </div>
          <span>Expenses</span>
        </a>
        <a href="#" class="nav-link" data-view="payments">
          <div class="nav-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 11 12 14 22 4"/>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5 a2 2 0 0 1 2-2h11"/>
            </svg>
          </div>
          <span>Payments</span>
        </a>
      </nav>
    </main>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════
       MODALS
       ═══════════════════════════════════════════════════════════════ -->

  <!-- ───── Expense Modal ───── -->
  <div class="modal-overlay" id="expense-modal">
    <div class="modal">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="modal-header">
        <h3 id="expense-modal-title">Add Expense</h3>
        <button class="modal-close" id="expense-modal-close" aria-label="Close">&times;</button>
      </div>

      <div class="form-error" id="expense-form-error"></div>

      <form id="expense-form" novalidate>
        <input type="hidden" id="expense-edit-id" />

        <div class="form-group">
          <label for="expense-name">Expense Name <span class="req">*</span></label>
          <input type="text" id="expense-name" placeholder="e.g. Restaurant Dinner" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="expense-category">Category</label>
            <select id="expense-category">
              <option value="Food">Food</option>
              <option value="Transportation">Transportation</option>
              <option value="Utilities">Utilities</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Shopping">Shopping</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="expense-date">Date</label>
            <input type="date" id="expense-date" />
          </div>
        </div>

        <div class="form-group">
          <label for="expense-amount">Total Amount (₱) <span class="req">*</span></label>
          <input type="number" id="expense-amount" min="0" step="0.01" placeholder="0.00" />
        </div>

        <div class="form-group">
          <label for="expense-description">Description</label>
          <textarea id="expense-description" rows="2" placeholder="Optional notes..."></textarea>
        </div>

        <!-- Split type toggle -->
        <div class="form-group">
          <label>Split Type</label>
          <div class="split-toggle">
            <button type="button" class="split-btn active" data-split="equal">Equal Split</button>
            <button type="button" class="split-btn" data-split="custom">Custom Split</button>
          </div>
          <input type="hidden" id="expense-split-type" value="equal" />
        </div>

        <!-- Participants -->
        <div class="form-group">
          <div class="participants-header">
            <label>Participants <span class="req">*</span></label>
            <button type="button" class="btn-small" id="btn-add-participant">+ Add</button>
          </div>
          <div id="participants-list">
            <!-- Dynamic rows inserted here by ExpenseView -->
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-cancel" id="expense-cancel-btn">Cancel</button>
          <button type="submit" class="btn-primary">Save Expense</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ───── Payment Modal ───── -->
  <div class="modal-overlay" id="payment-modal">
    <div class="modal modal-sm">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="modal-header">
        <h3 id="payment-modal-title">Record Payment</h3>
        <button class="modal-close" id="payment-modal-close" aria-label="Close">&times;</button>
      </div>

      <div class="form-error" id="payment-form-error"></div>

      <form id="payment-form" novalidate>
        <input type="hidden" id="payment-expense-id" />
        <input type="hidden" id="payment-participant-id" />
        <input type="hidden" id="payment-edit-id" />

        <div class="form-group">
          <label>Participant</label>
          <input type="text" id="payment-participant-name" readonly class="input-readonly" />
        </div>

        <div class="form-group">
          <label>Expense</label>
          <input type="text" id="payment-expense-name" readonly class="input-readonly" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Share</label>
            <input type="text" id="payment-share" readonly class="input-readonly" />
          </div>
          <div class="form-group">
            <label>Remaining</label>
            <input type="text" id="payment-remaining" readonly class="input-readonly" />
          </div>
        </div>

        <div class="form-group">
          <label for="payment-amount">Payment Amount (₱) <span class="req">*</span></label>
          <input type="number" id="payment-amount" min="0" step="0.01" placeholder="0.00" />
        </div>

        <div class="form-group">
          <label for="payment-date">Date</label>
          <input type="date" id="payment-date" />
        </div>

        <div class="form-actions">
          <button type="button" class="btn-cancel" id="payment-cancel-btn">Cancel</button>
          <button type="submit" class="btn-primary">Save Payment</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ───── Confirm Delete Modal ───── -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal modal-xs">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="modal-header">
        <h3>Confirm Delete</h3>
        <button class="modal-close" id="confirm-modal-close" aria-label="Close">&times;</button>
      </div>
      <p class="confirm-message" id="confirm-message">Are you sure you want to delete this item?</p>
      <div class="form-actions">
        <button type="button" class="btn-cancel" id="confirm-cancel-btn">Cancel</button>
        <button type="button" class="btn-danger" id="confirm-delete-btn">Delete</button>
      </div>
    </div>
  </div>

  <!-- ───── Entry point ───── -->
  <script type="module" src="js/controller.js"></script>
</body>
</html>
